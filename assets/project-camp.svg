  <line x1="240" y1="212" x2="240" y2="230" stroke="#111111" stroke-opacity="0.25"/>

  <g fill="#ffffff" stroke="#111111" stroke-opacity="0.35" stroke-width="1.2">
    <rect x="60" y="230" width="112" height="24" rx="5"/>
    <rect x="184" y="230" width="112" height="24" rx="5"/>
    <rect x="308" y="230" width="112" height="24" rx="5"/>
  </g>
  <text x="78" y="246" class="mono" font-size="9.5" fill="#6B7280">projects</text>
  <text x="202" y="246" class="mono" font-size="9.5" fill="#6B7280">tasks</text>
  <text x="326" y="246" class="mono" font-size="9.5" fill="#6B7280">notes</text>

  <text x="24" y="280" class="mono" font-size="10" letter-spacing="0.06em" fill="#6B7280">03 / PROJECT CAMP</text>
