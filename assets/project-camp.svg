<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered backend architecture for Project Camp: API, access control, service, and data layers">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0.5" y="0.5" width="479" height="299" rx="10" fill="#ffffff" stroke="#111111" stroke-opacity="0.12"/>

  <rect x="60" y="52" width="360" height="40" rx="6" fill="#ffffff" stroke="#111111" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="78" y="76" font-size="11" font-weight="600" fill="#111111">API</text>

  <line x1="240" y1="92" x2="240" y2="112" stroke="#111111" stroke-opacity="0.25"/>

  <rect x="60" y="112" width="360" height="40" rx="6" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="78" y="136" font-size="11" font-weight="600" fill="#3B5BDB">ACCESS CONTROL</text>
  <text x="392" y="136" class="mono" font-size="9" fill="#6B7280">RBAC</text>

  <line x1="240" y1="152" x2="240" y2="172" stroke="#111111" stroke-opacity="0.25"/>

  <rect x="60" y="172" width="360" height="40" rx="6" fill="#ffffff" stroke="#111111" stroke-opacity="0.35" stroke-width="1.2"/>
