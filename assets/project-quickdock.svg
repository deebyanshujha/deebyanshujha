<svg viewBox="0 0 420 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QuickDock search terminal">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .blink{animation:blink 1.05s steps(2,end) infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect x="1" y="1" width="418" height="70" rx="10" fill="#071018" stroke="#7FE9E0" stroke-opacity=".18"/>
  <circle cx="28" cy="24" r="4" fill="#7EE787" class="pulse"/>
  <text class="mono" x="42" y="28" font-size="11" fill="#7EE787">IN PROGRESS</text>
  <rect x="24" y="38" width="372" height="18" rx="9" fill="#05070B" stroke="#7FE9E0" stroke-opacity=".14"/>
  <text class="mono" x="42" y="51" font-size="11" fill="#EAFBFF">$ quickdock search apps/files</text>
  <rect class="blink" x="254" y="42" width="7" height="10" fill="#7FE9E0"/>
</svg>
