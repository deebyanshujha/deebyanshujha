<svg viewBox="0 0 680 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="building QuickDock terminal">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .blink{animation:blink 1s steps(2,end) infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect x="1" y="1" width="678" height="62" rx="12" fill="#071018" stroke="#7FE9E0" stroke-opacity=".18"/>
  <circle cx="28" cy="22" r="4" fill="#7EE787" class="pulse"/>
  <text class="mono" x="44" y="26" font-size="11" fill="#7EE787">IN PROGRESS</text>
  <text class="mono" x="28" y="47" font-size="15" fill="#EAFBFF">$ building_quickdock</text>
  <rect class="blink" x="205" y="34" width="8" height="16" fill="#7FE9E0"/>
</svg>
