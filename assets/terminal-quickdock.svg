<svg viewBox="0 0 240 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="$ quickdock --index with a blinking cursor">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <text class="mono" x="0" y="17" font-size="14" fill="#EAFBFF">$ quickdock --index</text>
  <rect class="blink" x="166" y="4" width="7" height="16" fill="#7FE9E0"/>
</svg>
