<svg viewBox="0 0 420 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="source to AST to resolve to execute">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .walk{animation:walk 4.8s linear infinite}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes walk{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(312px);opacity:0}}
  </style>
  <rect x="1" y="1" width="418" height="70" rx="10" fill="#071018" stroke="#7FE9E0" stroke-opacity=".18"/>
  <path d="M54 36H366" stroke="#7FE9E0" stroke-opacity=".22" stroke-width="1.4"/>
  <circle cx="54" cy="36" r="5" fill="#7FE9E0" class="pulse"/>
  <circle cx="158" cy="36" r="5" fill="#B9A7FF" class="pulse"/>
  <circle cx="262" cy="36" r="5" fill="#79E7FF" class="pulse"/>
  <circle cx="366" cy="36" r="5" fill="#7EE787" class="pulse"/>
  <circle cx="54" cy="36" r="3" fill="#EAFBFF" class="walk"/>
  <text class="mono" x="54" y="58" text-anchor="middle" font-size="9" fill="#9FB6C9">SOURCE</text>
  <text class="mono" x="158" y="58" text-anchor="middle" font-size="9" fill="#9FB6C9">AST</text>
  <text class="mono" x="262" y="58" text-anchor="middle" font-size="9" fill="#9FB6C9">RESOLVE</text>
  <text class="mono" x="366" y="58" text-anchor="middle" font-size="9" fill="#9FB6C9">EXECUTE</text>
</svg>
