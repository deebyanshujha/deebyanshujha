<svg width="1100" height="360" viewBox="0 0 1100 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Systems map</title>
  <desc id="desc">A dark layered systems map from application behavior down to language runtime, networking, operating systems, and hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#11140D"/>
    </linearGradient>
    <linearGradient id="flow" x1="120" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79C0FF"/>
      <stop offset="0.34" stop-color="#56D4DD"/>
      <stop offset="0.67" stop-color="#F2CC60"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(548 168) rotate(90) scale(170 500)">
      <stop offset="0" stop-color="#79C0FF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#F2CC60" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#263244" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#02040A" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .main { fill: #F0F6FC; }
      .muted { fill: #8B949E; }
      .rail { stroke-dasharray: 8 12; animation: rail 7s linear infinite; }
      .blink { animation: blink 1.6s steps(2, start) infinite; }
      .float1 { animation: float1 4s ease-in-out infinite; }
      .float2 { animation: float2 5s ease-in-out infinite; }
      @keyframes rail { to { stroke-dashoffset: -140; } }
      @keyframes blink { 50% { opacity: 0.22; } }
      @keyframes float1 { 50% { transform: translateY(-5px); } }
      @keyframes float2 { 50% { transform: translateY(5px); } }
    </style>
  </defs>

  <rect width="1100" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1100" height="360" rx="24" fill="url(#grid)" opacity="0.48"/>
  <rect width="1100" height="360" rx="24" fill="url(#glow)"/>

  <g transform="translate(44 38)">
    <text class="mono muted" x="0" y="0" font-size="14">./systems-map</text>
    <text class="sans main" x="0" y="42" font-size="30" font-weight="750">I like moving downward through the stack.</text>
    <text class="mono muted" x="0" y="73" font-size="14">from behavior I can observe -> to mechanisms I can reason about</text>
    <rect class="blink" x="642" y="53" width="9" height="20" fill="#7EE787"/>
  </g>

  <path class="rail" d="M178 190 H922" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" opacity="0.88"/>
  <path d="M178 190 C270 120 360 120 452 190 C545 260 636 260 728 190 C803 132 879 135 922 190" stroke="#303D52" stroke-width="2" opacity="0.7"/>

  <g filter="url(#shadow)">
    <g class="float1" transform="translate(78 142)">
      <rect width="178" height="96" rx="18" fill="#0D1117" stroke="#79C0FF"/>
      <text class="mono main" x="28" y="36" font-size="15">APPLICATION</text>
      <text class="mono muted" x="28" y="60" font-size="12">features, APIs</text>
      <text class="mono muted" x="28" y="78" font-size="12">observable behavior</text>
    </g>

    <g class="float2" transform="translate(278 142)">
      <rect width="178" height="96" rx="18" fill="#0D1117" stroke="#56D4DD"/>
      <text class="mono main" x="28" y="36" font-size="15">LANGUAGE</text>
      <text class="mono muted" x="28" y="60" font-size="12">lexer, parser, AST</text>
      <text class="mono muted" x="28" y="78" font-size="12">closures, classes</text>
    </g>

    <g class="float1" transform="translate(478 142)">
      <rect width="178" height="96" rx="18" fill="#0D1117" stroke="#F2CC60"/>
      <text class="mono main" x="28" y="36" font-size="15">NETWORK</text>
      <text class="mono muted" x="28" y="60" font-size="12">TCP, sockets</text>
      <text class="mono muted" x="28" y="78" font-size="12">message flow</text>
    </g>

    <g class="float2" transform="translate(678 142)">
      <rect width="178" height="96" rx="18" fill="#0D1117" stroke="#F97316"/>
      <text class="mono main" x="28" y="36" font-size="15">KERNEL</text>
      <text class="mono muted" x="28" y="60" font-size="12">syscalls, traps</text>
      <text class="mono muted" x="28" y="78" font-size="12">scheduler, memory</text>
    </g>

    <g class="float1" transform="translate(878 142)">
      <rect width="178" height="96" rx="18" fill="#0D1117" stroke="#7EE787"/>
      <text class="mono main" x="28" y="36" font-size="15">HARDWARE</text>
      <text class="mono muted" x="28" y="60" font-size="12">CPU, memory</text>
      <text class="mono muted" x="28" y="78" font-size="12">real constraints</text>
    </g>
  </g>

  <g transform="translate(77 286)">
    <rect width="946" height="38" rx="12" fill="#0D1117" stroke="#273142"/>
    <text class="mono muted" x="22" y="24" font-size="13">working rule:</text>
    <text class="mono main" x="132" y="24" font-size="13">when an abstraction feels magical, open it and find the moving parts</text>
  </g>
</svg>
