<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClassForge editor canvas showing three UML classes, Node, Edge, and Graph, connected by inheritance and composition, with Edge selected">
  <defs>
    <pattern id="cg" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#111111" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#ffffff" stroke="#111111" stroke-opacity="0.12"/>

  <line x1="0" y1="48" x2="760" y2="48" stroke="#111111" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="26" cy="24" r="4" fill="none" stroke="#111111" stroke-opacity="0.3"/>
  <circle cx="42" cy="24" r="4" fill="none" stroke="#111111" stroke-opacity="0.3"/>
  <circle cx="58" cy="24" r="4" fill="none" stroke="#111111" stroke-opacity="0.3"/>
  <text x="82" y="29" class="mono" font-size="11" fill="#6B7280">graph-model.classforge</text>
  <text x="736" y="29" text-anchor="end" class="mono" font-size="11" fill="#6B7280">3 classes · 2 relationships</text>

  <rect x="24" y="72" width="712" height="340" fill="url(#cg)"/>

  <path d="M 290 150 L 400 150" stroke="#111111" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M 400 150 L 386 143 M 400 150 L 386 157" stroke="#111111" stroke-opacity="0.3" stroke-width="1.2"/>

  <path d="M 235 220 L 235 320 L 400 320" stroke="#3B5BDB" stroke-width="1.6" fill="none"/>
  <path d="M 400 320 L 386 313 L 386 327 Z" fill="#3B5BDB"/>

  <g>
    <rect x="120" y="160" width="170" height="60" rx="6" fill="#ffffff" stroke="#111111" stroke-opacity="0.4" stroke-width="1.3"/>
    <text x="136" y="184" font-size="14" font-weight="700" fill="#111111">Node</text>
    <line x1="120" y1="192" x2="290" y2="192" stroke="#111111" stroke-opacity="0.12"/>
    <text x="136" y="208" class="mono" font-size="11" fill="#6B7280">id, label</text>
  </g>

  <g>
