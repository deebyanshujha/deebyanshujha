<svg viewBox="0 0 1200 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IDEA to BUILD to TEST to DEBUG to SHIP">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .packet{animation:travel 6s linear infinite}
    @keyframes travel{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(920px);opacity:0}}
  </style>
  <rect x="1" y="1" width="1198" height="84" rx="16" fill="#071018" stroke="#7FE9E0" stroke-opacity=".14"/>
  <path d="M140 43H1060" stroke="#7FE9E0" stroke-opacity=".18" stroke-width="2"/>
  <circle class="packet" cx="140" cy="43" r="5" fill="#EAFBFF"/>
  <g class="mono" font-size="15" font-weight="700" fill="#EAFBFF" text-anchor="middle">
    <text x="140" y="27">IDEA</text>
    <text x="370" y="27">BUILD</text>
    <text x="600" y="27">TEST</text>
    <text x="830" y="27">DEBUG</text>
    <text x="1060" y="27">SHIP</text>
  </g>
  <g fill="#7FE9E0">
    <circle cx="140" cy="43" r="4"/><circle cx="370" cy="43" r="4"/><circle cx="600" cy="43" r="4"/><circle cx="830" cy="43" r="4"/><circle cx="1060" cy="43" r="4"/>
  </g>
</svg>
