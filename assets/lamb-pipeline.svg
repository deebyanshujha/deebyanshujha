<svg width="1100" height="270" viewBox="0 0 1100 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lamb interpreter pipeline</title>
  <desc id="desc">A visual pipeline of the Lamb programming language implementation from source to runtime.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1100" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#101820"/>
      <stop offset="1" stop-color="#15120C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79C0FF"/>
      <stop offset="0.5" stop-color="#F2CC60"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.9"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #8B949E; }
      .main { fill: #F0F6FC; }
      .wire { stroke-dasharray: 10 12; animation: flow 6s linear infinite; }
      .tick { animation: tick 2.8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -154; } }
      @keyframes tick { 50% { opacity: 0.45; } }
    </style>
  </defs>

  <rect width="1100" height="270" rx="22" fill="url(#panel)" stroke="#273142"/>
  <rect width="1100" height="270" rx="22" fill="url(#dots)" opacity="0.55"/>
  <text class="mono muted" x="36" y="45" font-size="14">project:lamb</text>
  <text class="sans main" x="36" y="82" font-size="30" font-weight="700">A programming language, built layer by layer</text>
  <text class="mono muted" x="36" y="111" font-size="14">Java interpreter with lexical analysis, parsing, scope resolution, closures, classes, and inheritance.</text>

  <path class="wire" d="M120 174 H980" stroke="url(#edge)" stroke-width="3" opacity="0.9"/>

  <g transform="translate(58 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#79C0FF"/>
    <text class="mono main" x="29" y="31" font-size="15">SOURCE</text>
    <text class="mono muted" x="35" y="50" font-size="11">text</text>
  </g>

  <g transform="translate(226 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#56D4DD"/>
    <text class="mono main" x="37" y="31" font-size="15">LEXER</text>
    <text class="mono muted" x="34" y="50" font-size="11">tokens</text>
  </g>

  <g transform="translate(394 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#F2CC60"/>
    <text class="mono main" x="32" y="31" font-size="15">PARSER</text>
    <text class="mono muted" x="28" y="50" font-size="11">grammar</text>
  </g>

  <g transform="translate(562 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#F97316"/>
    <text class="mono main" x="45" y="31" font-size="15">AST</text>
    <text class="mono muted" x="34" y="50" font-size="11">nodes</text>
  </g>

  <g transform="translate(730 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#7EE787"/>
    <text class="mono main" x="25" y="31" font-size="15">RESOLVER</text>
    <text class="mono muted" x="23" y="50" font-size="11">scope</text>
  </g>

  <g transform="translate(898 141)">
    <rect width="124" height="66" rx="14" fill="#0D1117" stroke="#A371F7"/>
    <text class="mono main" x="24" y="31" font-size="15">RUNTIME</text>
    <text class="mono muted" x="18" y="50" font-size="11">behavior</text>
  </g>

  <g class="tick">
    <circle cx="120" cy="174" r="5" fill="#79C0FF"/>
    <circle cx="288" cy="174" r="5" fill="#56D4DD"/>
    <circle cx="456" cy="174" r="5" fill="#F2CC60"/>
    <circle cx="624" cy="174" r="5" fill="#F97316"/>
    <circle cx="792" cy="174" r="5" fill="#7EE787"/>
    <circle cx="960" cy="174" r="5" fill="#A371F7"/>
  </g>

  <text class="mono muted" x="66" y="239" font-size="13">closures</text>
  <text class="mono muted" x="198" y="239" font-size="13">functions</text>
  <text class="mono muted" x="342" y="239" font-size="13">visitor pattern</text>
  <text class="mono muted" x="544" y="239" font-size="13">classes</text>
  <text class="mono muted" x="680" y="239" font-size="13">inheritance</text>
  <text class="mono muted" x="846" y="239" font-size="13">environment</text>
</svg>
