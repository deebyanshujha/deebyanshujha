<svg viewBox="0 0 420 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChatterNet TCP connection graph">
  <style>
    .node{animation:pulse 2.8s ease-in-out infinite}
    .packet{animation:packet 4s linear infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes packet{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(250px);opacity:0}}
  </style>
  <rect x="1" y="1" width="418" height="70" rx="10" fill="#071018" stroke="#7FE9E0" stroke-opacity=".18"/>
  <path d="M82 36H338M210 36V18M210 36V56" stroke="#7FE9E0" stroke-opacity=".24" stroke-width="1.4"/>
  <circle class="node" cx="82" cy="36" r="7" fill="#7FE9E0"/>
  <circle class="node" cx="210" cy="18" r="7" fill="#B9A7FF"/>
  <circle class="node" cx="210" cy="36" r="8" fill="#EAFBFF"/>
  <circle class="node" cx="210" cy="56" r="7" fill="#79E7FF"/>
  <circle class="node" cx="338" cy="36" r="7" fill="#7EE787"/>
  <circle class="packet" cx="82" cy="36" r="3" fill="#EAFBFF"/>
</svg>
