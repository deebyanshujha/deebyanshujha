<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology for ChatterNet: a central server broadcasting to six connected clients">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0.5" y="0.5" width="479" height="299" rx="10" fill="#ffffff" stroke="#111111" stroke-opacity="0.12"/>

  <g stroke="#111111" stroke-opacity="0.18" stroke-width="1.1">
    <line x1="240" y1="146" x2="120" y2="76"/>
    <line x1="240" y1="146" x2="360" y2="74"/>
    <line x1="240" y1="146" x2="104" y2="186"/>
    <line x1="240" y1="146" x2="140" y2="228"/>
    <line x1="240" y1="146" x2="340" y2="224"/>
  </g>
  <line x1="240" y1="146" x2="376" y2="172" stroke="#3B5BDB" stroke-width="1.4"/>

  <circle cx="240" cy="146" r="16" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.6"/>
  <circle cx="240" cy="146" r="5" fill="#3B5BDB"/>

  <g fill="#ffffff" stroke="#111111" stroke-opacity="0.4" stroke-width="1.2">
    <circle cx="120" cy="76" r="6"/>
    <circle cx="360" cy="74" r="6"/>
    <circle cx="104" cy="186" r="6"/>
    <circle cx="140" cy="228" r="6"/>
    <circle cx="340" cy="224" r="6"/>
  </g>
  <circle cx="376" cy="172" r="6" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.3"/>

  <text x="24" y="256" class="mono" font-size="10" letter-spacing="0.06em" fill="#6B7280">02 / CHATTERNET</text>
</svg>
