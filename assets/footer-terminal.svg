<svg viewBox="0 0 760 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="end of profile terminal">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .blink{animation:blink 1s steps(2,end) infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
  </style>
  <rect x="1" y="1" width="758" height="56" rx="12" fill="#071018" stroke="#7FE9E0" stroke-opacity=".18"/>
  <circle class="pulse" cx="28" cy="29" r="4" fill="#7EE787"/>
  <text class="mono" x="44" y="34" font-size="13" fill="#9FB6C9">SYSTEM ONLINE // END OF PROFILE // BUILD -> SHIP -> REPEAT</text>
  <rect class="blink" x="625" y="21" width="8" height="16" fill="#7FE9E0"/>
</svg>
