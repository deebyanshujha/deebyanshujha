<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Deebyanshu Jha first principles software profile hero</title>
  <desc id="desc">A dark systems console showing a first principles software map with compiler, networking, and operating system concepts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset="0.46" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#12100A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.48" stop-color="#F2CC60"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#56D4DD"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 188) rotate(90) scale(140 210)">
      <stop offset="0" stop-color="#79C0FF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#F2CC60" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#223047" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .dim { fill: #8B949E; }
      .text { fill: #C9D1D9; }
      .line { stroke-dasharray: 9 13; animation: dash 7s linear infinite; }
      .blink { animation: blink 1.2s steps(2, start) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.8s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes blink { 50% { opacity: 0.18; } }
      @keyframes pulse { 50% { opacity: 0.55; } }
      @keyframes scan {
        0%, 100% { transform: translateY(-70px); opacity: 0; }
        12%, 82% { opacity: 0.45; }
        50% { transform: translateY(310px); opacity: 0.2; }
      }
    </style>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="26" fill="url(#grid)" opacity="0.52"/>
  <rect x="0" y="0" width="1200" height="430" rx="26" fill="url(#core)"/>
  <rect x="42" y="38" width="1116" height="354" rx="22" fill="#0D1117" opacity="0.76" stroke="#273142"/>
  <rect class="scan" x="43" y="54" width="1114" height="62" fill="url(#cyan)" opacity="0.12"/>

  <g transform="translate(75 72)">
    <circle cx="10" cy="10" r="6" fill="#F97316"/>
    <circle cx="31" cy="10" r="6" fill="#F2CC60"/>
    <circle cx="52" cy="10" r="6" fill="#7EE787"/>
    <text class="mono dim" x="78" y="15" font-size="14">~/github/deebyanshujha :: booting profile from first principles</text>
  </g>

  <g transform="translate(78 119)">
    <text class="mono" x="0" y="0" fill="#7EE787" font-size="18">&gt; whoami</text>
    <text class="sans" x="0" y="67" fill="#F0F6FC" font-size="64" font-weight="800" letter-spacing="2">DEEBYANSHU JHA</text>
    <rect x="0" y="90" width="452" height="2" fill="url(#gold)"/>
    <text class="mono text" x="0" y="132" font-size="19">CS student studying the internals behind software.</text>
    <text class="mono dim" x="0" y="166" font-size="16">not collecting abstractions; tracing them down to the metal</text>
    <text class="mono" x="0" y="222" fill="#79C0FF" font-size="16">focus:</text>
    <text class="mono text" x="72" y="222" font-size="16">compilers / kernels / networking / backend systems</text>
    <text class="mono" x="0" y="259" fill="#F2CC60" font-size="16">status:</text>
    <text class="mono text" x="82" y="259" font-size="16">700+ DSA problems solved, still rebuilding the foundations</text>
    <rect class="blink" x="564" y="247" width="10" height="24" fill="#7EE787"/>
  </g>

  <g transform="translate(720 88)" filter="url(#softGlow)">
    <path class="line" d="M77 98 C164 20 255 24 340 91" stroke="#79C0FF" stroke-width="2" opacity="0.76"/>
    <path class="line" d="M83 176 C168 258 256 252 342 184" stroke="#F2CC60" stroke-width="2" opacity="0.72"/>
    <path class="line" d="M78 98 L82 176 L211 132 L340 91 L342 184 L211 132 Z" stroke="#38465D" stroke-width="1.5" opacity="0.9"/>

    <g class="pulse">
      <circle cx="78" cy="98" r="35" fill="#0D1117" stroke="#79C0FF" stroke-width="2"/>
      <text class="mono text" x="50" y="103" font-size="13">SOURCE</text>
    </g>
    <g class="pulse2">
      <circle cx="211" cy="132" r="42" fill="#0D1117" stroke="#F2CC60" stroke-width="2"/>
      <text class="mono text" x="183" y="126" font-size="13">PARSE</text>
      <text class="mono dim" x="185" y="145" font-size="11">AST</text>
    </g>
    <g class="pulse">
      <circle cx="340" cy="91" r="36" fill="#0D1117" stroke="#7EE787" stroke-width="2"/>
      <text class="mono text" x="310" y="96" font-size="13">RUNTIME</text>
    </g>
    <g>
      <circle cx="82" cy="176" r="33" fill="#0D1117" stroke="#F97316" stroke-width="2"/>
      <text class="mono text" x="57" y="181" font-size="13">TCP</text>
    </g>
    <g>
      <circle cx="342" cy="184" r="33" fill="#0D1117" stroke="#56D4DD" stroke-width="2"/>
      <text class="mono text" x="319" y="189" font-size="13">xv6</text>
    </g>
    <g>
      <rect x="142" y="244" width="142" height="42" rx="10" fill="#0D1117" stroke="#303D52"/>
      <text class="mono dim" x="166" y="270" font-size="13">DSA as discipline</text>
    </g>
  </g>

  <g transform="translate(78 359)">
    <text class="mono dim" font-size="13">frameworks are tools</text>
    <rect x="171" y="-10" width="90" height="2" fill="#303D52"/>
    <text class="mono" x="279" y="0" fill="#F2CC60" font-size="13">fundamentals are leverage</text>
  </g>
</svg>
