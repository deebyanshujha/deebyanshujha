<svg viewBox="0 0 1200 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DEEBYANSHU JHA">
  <defs>
    <linearGradient id="name" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAFBFF"/>
      <stop offset="0.28" stop-color="#79E7FF"/>
      <stop offset="0.55" stop-color="#B9A7FF"/>
      <stop offset="0.78" stop-color="#7EE787"/>
      <stop offset="1" stop-color="#EAFBFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#7FE9E0" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#766BFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8AF7FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .drift{animation:drift 13s ease-in-out infinite alternate}
    .scan{animation:scan 6s linear infinite}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.88}}
    @keyframes drift{0%{transform:translateX(-12px)}100%{transform:translateX(12px)}}
    @keyframes scan{0%{transform:translateX(-340px)}100%{transform:translateX(1240px)}}
  </style>

  <rect width="1200" height="310" rx="28" fill="#05070B"/>
  <rect width="1200" height="310" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="145" rx="520" ry="150" fill="url(#glow)" class="pulse"/>

  <g opacity="0.42" class="drift">
    <path d="M115 222C235 132 316 206 420 142S612 94 746 164s228 8 340-70" fill="none" stroke="#7FE9E0" stroke-width="1.2" stroke-opacity="0.38"/>
    <path d="M124 88c100 52 188 18 274 48s151 91 276 45 184-109 398-44" fill="none" stroke="#B9A7FF" stroke-width="1" stroke-opacity="0.28"/>
    <circle cx="186" cy="194" r="3.2" fill="#7FE9E0"/>
    <circle cx="426" cy="142" r="2.8" fill="#B9A7FF"/>
    <circle cx="742" cy="164" r="3" fill="#7EE787"/>
    <circle cx="996" cy="116" r="2.6" fill="#79E7FF"/>
  </g>

  <rect x="86" y="62" width="1028" height="186" rx="22" fill="#071018" fill-opacity="0.58" stroke="#7FE9E0" stroke-opacity="0.16"/>
  <text x="600" y="171" text-anchor="middle" class="sans" font-size="86" font-weight="850" letter-spacing="8" fill="url(#name)">DEEBYANSHU JHA</text>
  <text x="600" y="208" text-anchor="middle" class="mono" font-size="14" letter-spacing="6" fill="#9FB6C9">SYSTEMS  /  BACKEND  /  DEVELOPER TOOLS</text>

  <rect class="scan" x="-260" y="61" width="260" height="188" fill="#EAFBFF" opacity="0.08" filter="url(#soft)"/>
  <path d="M30 30h42M30 30v42M1170 30h-42M1170 30v42M30 280h42M30 280v-42M1170 280h-42M1170 280v-42" fill="none" stroke="#7FE9E0" stroke-opacity="0.44" stroke-width="1.3"/>
</svg>
