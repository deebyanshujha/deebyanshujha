# The organism's metabolism.
#
# Once a day the real contribution calendar is read and fed back into the
# genome, so the number of impulses, the glow of the pathways and the
# respiration trace all reflect how much actually got built lately.
#
# If the read fails, nothing is committed and the last healthy organism stays
# in place. Reliability beats liveness.
name: metabolism

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/organism.json'
      - 'tools/**'
      - '.github/workflows/metabolism.yml'

permissions:
  contents: write

concurrency:
  group: metabolism
  cancel-in-progress: true

jobs:
  respire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read metabolism
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_USER: ${{ github.repository_owner }}
        run: node tools/fetch-metabolism.mjs >> "$GITHUB_ENV"

      - name: Regrow organism
        run: node tools/generate-organism.mjs

      - name: Commit if the organism changed
        run: |
          git config user.name  'organism'
          git config user.email 'organism@users.noreply.github.com'
          if git diff --quiet -- assets/organism.svg data/organism.json; then
            echo "no metabolic change"
            exit 0
          fi
          git add assets/organism.svg data/organism.json
          git commit -m "metabolism: $(date -u +%Y-%m-%d)"
          git push
